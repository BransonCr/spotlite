# spotlite theme “tokyo-night”: Neon cyberpunk: glowing frames, powerline tabs, S P A C E D titles, a cover on stage, a neon horizon.
#
# Edit and save: a running spotlite shows the change within a second.
# Check it: spotlite theme check tokyo-night   ·   Use it: spotlite theme set tokyo-night
# A key you leave out takes the value of amber. A typo or a bad value is an error.
# The background is your terminal's own (its opacity shows through).

# Colours ("#rrggbb")
text     = "#c0caf5"  # song names, normal text
bright   = "#e0e6ff"  # titles, the selected row
muted    = "#9aa5ce"  # second lines, artists
faint    = "#565f89"  # hints, numbers
border   = "#292e42"  # panel lines
selected = "#24283b"  # selected row and pill background
accent   = "#7aa2f7"  # highlights; start of gradients
accent2  = "#bb9af7"  # end of gradients (progress bar, logo, borders)
red      = "#f7768e"  # errors, remove, the top of the volume LEDs
green    = "#9ece6a"  # liked songs, the active device
love     = "#ff5c8a"  # the like heart (vivid)
viz_low  = "#16161e"  # visualizer, bottom shade; dark text on accent
viz_high = "#24283b"  # visualizer, top shade
viz_line = "#7dcfff"  # visualizer line and dots

# Look and feel
layout   = "stage"     # classic (player at the bottom) | stage (big cover column on wide terminals) | top (player at the top)
frame    = "full"      # full (four sides) | rule (a top line with the title) | none (space only)
frame_fx = "glow"      # plain | gradient (lines run accent → accent2) | glow (lines breathe while music plays)
corners  = "rounded"   # rounded | plain | thick | double
titles   = "spaced"    # normal | lower | upper | spaced (L I K E D)
header   = "powerline" # plain | pills | brackets | powerline
nerd     = true        # Nerd Font glyphs (powerline arrows, the like heart); false if your terminal lacks them
select   = "arrow"     # bar (marker + soft background) | block (inverse) | underline | arrow (❯)
marker   = "┃"         # one character before the selected row (select = bar or underline)
viz      = "mirror"    # wave | bars | mirror | dots | none
aura     = "traces"    # sidebar effect (V): grooves | stardust | pixels | aurora | ribbons | traces | halftone | phosphor
progress = "blocks"    # line | knob (●) | blocks (stepped gradient) | wave (moving ∿)
bar      = "▰▱"        # two characters: filled and empty part of the progress and volume bars
volume   = "leds"      # bar | leds (VU meter: green, accent, red)
playing  = "spin"      # eq (▁▃▅▇) | spin (◐◓◑◒) | pulse (·•●) | logo (still)
logo     = "★"         # one character before "spotlite", in empty lists, and when paused
bullet   = "╱"         # one character between "artist · album" and the footer hints
leaders  = false       # true: dots from each song title to the next column, like a printed track list
motion   = true        # false: no animation (also: SPOTLITE_NO_MOTION=1)
