# spotlite theme “nord”: Calm Scandinavian minimal: thin rules instead of boxes, a cover on stage, an aurora mirrored on the horizon.
#
# Edit and save: a running spotlite shows the change within a second.
# Check it: spotlite theme check nord   ·   Use it: spotlite theme set nord
# A key you leave out takes the value of amber. A typo or a bad value is an error.
# The background is your terminal's own (its opacity shows through).

# Colours ("#rrggbb")
text     = "#d8dee9"  # song names, normal text
bright   = "#eceff4"  # titles, the selected row
muted    = "#7b88a1"  # second lines, artists
faint    = "#4c566a"  # hints, numbers
border   = "#434c5e"  # panel lines
selected = "#3b4252"  # selected row and pill background
accent   = "#88c0d0"  # highlights; start of gradients
accent2  = "#5e81ac"  # end of gradients (progress bar, logo, borders)
red      = "#bf616a"  # errors, remove, the top of the volume LEDs
green    = "#a3be8c"  # liked songs, the active device
love     = "#e06c88"  # the like heart (vivid)
viz_low  = "#1e222a"  # visualizer, bottom shade; dark text on accent
viz_high = "#2e3440"  # visualizer, top shade
viz_line = "#8fbcbb"  # visualizer line and dots

# Look and feel
layout   = "stage"     # classic (player at the bottom) | stage (big cover column on wide terminals) | top (player at the top)
frame    = "rule"      # full (four sides) | rule (a top line with the title) | none (space only)
frame_fx = "plain"     # plain | gradient (lines run accent → accent2) | glow (lines breathe while music plays)
corners  = "plain"     # rounded | plain | thick | double
titles   = "normal"    # normal | lower | upper | spaced (L I K E D)
header   = "plain"     # plain | pills | brackets | powerline
nerd     = true        # Nerd Font glyphs (powerline arrows, the like heart); false if your terminal lacks them
select   = "arrow"     # bar (marker + soft background) | block (inverse) | underline | arrow (❯)
marker   = "▍"         # one character before the selected row (select = bar or underline)
viz      = "mirror"    # wave | bars | mirror | dots | none
liquid   = "ice"       # sidebar effect (V): honey | soda | lava | ink | ice | dew | neon
progress = "line"      # line | knob (●) | blocks (stepped gradient) | wave (moving ∿)
bar      = "─╌"        # two characters: filled and empty part of the progress and volume bars
volume   = "bar"       # bar | leds (VU meter: green, accent, red)
playing  = "logo"      # eq (▁▃▅▇) | spin (◐◓◑◒) | pulse (·•●) | logo (still)
logo     = "◆"         # one character before "spotlite", in empty lists, and when paused
bullet   = "·"         # one character between "artist · album" and the footer hints
leaders  = false       # true: dots from each song title to the next column, like a printed track list
motion   = true        # false: no animation (also: SPOTLITE_NO_MOTION=1)
