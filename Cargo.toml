[package]
name = "spotlite"
version = "0.1.0"
edition = "2021"
description = "Lightweight Spotify client: a terminal UI on top of spotifyd and the Spotify Web API"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
open = "5"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
