# spotifyd config for spotlite. Copy to ~/.config/spotifyd/spotifyd.conf
# spotifyd plays the audio; spotlite only tells it what to play.

[global]
# Must match device_name in ~/.config/spotlite/config.toml
device_name = "spotlite"
device_type = "computer"

# PipeWire's pulse server works here
backend = "pulseaudio"
bitrate = 320
volume_controller = "softvol"
initial_volume = 60
volume_normalisation = true

# Media keys / waybar / playerctl see it as "spotifyd"
use_mpris = true
dbus_type = "session"

# Keep disk and CPU low: no audio cache, no LAN discovery
# (login comes from `spotifyd authenticate` instead)
no_audio_cache = true
disable_discovery = true
